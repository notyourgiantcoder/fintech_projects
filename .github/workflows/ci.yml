name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      # Offline guardrail evaluation: fails the build if any labelled case regresses.
      - run: finbo eval --json eval-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval-results.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finbo .
      - name: Smoke-test the image
        run: |
          docker run -d --name app -p 7860:7860 -e FINBO_DEV_AUTH=1 finbo
          for i in $(seq 1 30); do curl -fs localhost:7860/api/health && break; sleep 2; done
          curl -fs localhost:7860/api/demo?market=in | grep -q interest_saved_with_avalanche
          curl -fs localhost:7860/app/money | grep -q '<div id="root">'
          docker logs app
